[project]
name = "energy-data"
version = "0.1.0"
description = "Data pipelines of the platform: ONS ingestion, data lake and aggregate loading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["polars==2.0.0", "pyyaml==6.0.3", "selectolax==1.0.0"]

[project.optional-dependencies]
local = [
    "boto3==1.43.114",
    "psycopg2-binary==2.9.13",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-psycopg2==2.9.21.20261008",
    "types-pyyaml==6.0.12.20260906",
    "types-requests==2.33.0.20261006",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["energy_pipeline"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
