x-prod-env: &prod-env
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  LAKE_S3_ENDPOINT_URL: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: sa-east-1
  LAKE_BUCKET: ${LAKE_BUCKET:?set LAKE_BUCKET}
  WAREHOUSE_DSN: ${WAREHOUSE_DSN:?set WAREHOUSE_DSN}
  API_URL: ${API_URL:?set API_URL}

services:
  airflow-init:
    image: ${ECR_IMAGE:?set ECR_IMAGE}
    environment: *prod-env
  airflow-apiserver:
    image: ${ECR_IMAGE}
    environment: *prod-env
    ports: !reset ["127.0.0.1:8080:8080"]
  airflow-scheduler:
    image: ${ECR_IMAGE}
    environment: *prod-env
    depends_on: !reset
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
  airflow-dag-processor:
    image: ${ECR_IMAGE}
    environment: *prod-env
  lake:
    profiles: ["local"]
  warehouse-db:
    profiles: ["local"]
  migrate:
    profiles: ["local"]
